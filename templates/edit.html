<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
    <title>Edit Event</title>
    <style>
        body {
            background-color: #121212; color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 15px; 
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 18, 18, 0.85);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; padding: 20px; overflow-y: auto;
        }
        .edit-card {
            background: #1e1e1e; padding: 30px; border-radius: 12px;
            width: 100%; max-width: 480px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 20px;
        }
        h2 { margin: 0; color: #bb86fc; }
        input[type="text"], textarea, select {
            width: 100%; padding: 14px; border-radius: 8px;
            border: 1px solid #333; font-size: 16px;
            background: #2c2c2c; color: white; outline: none;
            box-sizing: border-box; font-family: inherit;
        }
        .meta-inputs { display: flex; gap: 10px; }
        .small-input {
            background: #2c2c2c; color: #aaa; border: 1px solid #333; padding: 10px;
            border-radius: 6px; font-size: 14px; outline: none; flex: 1; min-width: 0;
        }
        
        /* Recurrence Selection Styles */
        .recurrence-box {
            border: 1px solid #333; border-radius: 8px; padding: 15px; background: #161616;
        }
        .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .radio-label { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
        .radio-label input[type="radio"] { accent-color: #bb86fc; transform: scale(1.1); }
        .config-pane {
            margin-top: 12px; padding-top: 12px; border-top: 1px dashed #333;
            display: none; gap: 10px;
        }
		.inline-inputs { display: flex; gap: 8px; align-items: center; }

		/* Dedicated class for recurrence numbers to prevent flex stretching */
		.number-box {
			background: #2c2c2c; color: #aaa; border: 1px solid #333;
			padding: 10px 4px; border-radius: 6px; font-size: 14px; outline: none;
			width: 45px; /* Reduced from 60px for a tight 2-digit fit */
			text-align: center;
			flex: none; /* Completely disables stretching */
		}
        
        .inline-inputs select { width: auto; padding: 8px 12px; }

        .btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 12px; border: none; border-radius: 8px;
            font-size: 16px; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none;
        }
        .save-btn { background-color: #bb86fc; color: #000; }
        .cancel-btn { background-color: #333; color: #fff; }
        .delete-btn-modal { background-color: transparent; border: 1px solid #ff5252; color: #ff5252; }
        .delete-btn-modal:hover { background-color: #ff5252; color: #000; }
    </style>
</head>
<body>

    <div class="modal-overlay">
        <div class="edit-card">
            <h2>Edit Event <span style="font-size: 0.6em; color: #555; vertical-align: middle;">#{{ event.id }}</span></h2>
            <form method="POST">
                <input type="text" name="content" style="margin-bottom: 10px;" value="{{ event.content }}" required autocomplete="off">
                
                <textarea name="context" rows="3" placeholder="Add details, links, or notes..." style="font-size: 14px; color: #aaa; margin-bottom: 10px;">{{ event.context or '' }}</textarea>
                
                <div class="meta-inputs">
                    <input type="text" name="label" class="small-input" placeholder="Label" list="labels-list" value="{{ event.label or '' }}">
                    <input type="text" name="assignee" class="small-input" placeholder="Assignee" list="assignees-list" value="{{ event.assignee or '' }}">
                    <input type="date" name="due_date" class="small-input" style="color-scheme: dark;" value="{{ event.due_date.isoformat() if event.due_date else '' }}" required>
                </div>

                <datalist id="labels-list">{% for l in labels %}<option value="{{ l }}">{% endfor %}</datalist>
                <datalist id="assignees-list">{% for a in assignees %}<option value="{{ a }}">{% endfor %}</datalist>

                <div class="recurrence-box" style="margin-top: 15px;">
                    <span style="font-size: 0.85rem; font-weight: bold; color: #bb86fc;">Repeat</span>
                    <div class="radio-group">
                        <label class="radio-label">
                            <input type="radio" name="recurrence_type" value="none" {% if not template %}checked{% endif %} onchange="toggleRecurrencePanes()">
                            Does not repeat
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="recurrence_type" value="interval" {% if template and template.recurrence_type != 'relative' %}checked{% endif %} onchange="toggleRecurrencePanes()">
                            On a fixed schedule (counted from the due date)
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="recurrence_type" value="relative" {% if template and template.recurrence_type == 'relative' %}checked{% endif %} onchange="toggleRecurrencePanes()">
                            After I finish it (counted from completion)
                        </label>
                    </div>

                    <div id="pane-interval" class="config-pane" style="flex-direction: column;">
                        <div class="inline-inputs">
                            <span>Every</span>
                            <input type="number" name="interval_value" class="number-box" min="1" max="999" value="{{ template.interval_value if template else 1 }}">
                            <select name="interval_unit" onchange="toggleRecurrencePanes()">
                                {% for unit in ['days', 'weeks', 'months', 'years'] %}
                                    <option value="{{ unit }}" {% if template and template.interval_unit == unit %}selected{% endif %}>{{ unit|capitalize }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <select name="monthly_mode" id="monthly-mode" style="margin-top: 4px; font-size: 14px; padding: 8px 12px;">
                            <option value="day" {% if not template or template.monthly_mode() == 'day' %}selected{% endif %}></option>
                            <option value="nth" {% if template and template.monthly_mode() == 'nth' %}selected{% endif %}></option>
                            <option value="last" {% if template and template.monthly_mode() == 'last' %}selected{% endif %}></option>
                        </select>
                        <span id="anchor-hint" style="font-size: 0.75rem; color: #777;">Based on the due date. The 31st becomes the last day of shorter months; Feb 29 becomes Feb 28.</span>
                    </div>
                </div>

			<div class="btn-group">
				<button type="submit" 
						formaction="/delete/{{ event.id }}" 
						formmethod="POST" 
						class="btn delete-btn-modal" 
						onclick="return confirm({{ ('Delete this task AND stop it repeating?\n\nTo drop only this occurrence, use Skip instead.' if template else 'Permanently delete this task?')|tojson|forceescape }});">
					Delete
				</button>
				<a href="/" class="btn cancel-btn">Cancel</a>
				<button type="submit" class="btn save-btn">Save</button>
			</div>
            </form>
        </div>
    </div>

    <script>
        const ORD = ['1st', '2nd', '3rd', '4th'];
        const DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

        // Label the monthly options from the current due date, e.g.
        // "on day 13" / "on the 2nd Tuesday" / "on the last Tuesday".
        function refreshMonthlyOptions() {
            const val = document.querySelector('input[name="due_date"]').value;
            const sel = document.getElementById('monthly-mode');
            if (!val) return;
            const [y, m, d] = val.split('-').map(Number);
            const date = new Date(y, m - 1, d);
            const n = Math.floor((d - 1) / 7) + 1;
            const isLast = d + 7 > new Date(y, m, 0).getDate();
            const day = DAYS[date.getDay()];
            const [optDay, optNth, optLast] = sel.options;
            optDay.text = `Monthly on day ${d}`;
            optNth.text = `Monthly on the ${ORD[n - 1] || ''} ${day}`;
            optLast.text = `Monthly on the last ${day}`;
            optNth.hidden = optNth.disabled = n > 4;
            optLast.hidden = optLast.disabled = !isLast;
            if (sel.selectedOptions[0].disabled) sel.value = isLast && n > 4 ? 'last' : 'day';
        }

        function toggleRecurrencePanes() {
            const selected = document.querySelector('input[name="recurrence_type"]:checked').value;
            const unit = document.querySelector('select[name="interval_unit"]').value;
            document.getElementById('pane-interval').style.display = selected === 'none' ? 'none' : 'flex';
            const fixedMonthly = selected === 'interval' && unit === 'months';
            document.getElementById('monthly-mode').style.display = fixedMonthly ? 'block' : 'none';
            document.getElementById('anchor-hint').style.display =
                selected === 'interval' && (unit === 'months' || unit === 'years') ? 'block' : 'none';
            refreshMonthlyOptions();
        }
        document.querySelector('input[name="due_date"]').addEventListener('change', refreshMonthlyOptions);
        // Initialize visibility configurations on render
        document.addEventListener("DOMContentLoaded", toggleRecurrencePanes);
    </script>
</body>
</html>
