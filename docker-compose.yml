services:
  scheduler:
    build: .
    container_name: scheduler
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=${TZ:-America/New_York} # Forces the container OS to use Eastern Time
      - API_BACKUP_KEY=${API_BACKUP_KEY}
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # This mapping ensures your database survives if you delete the container
      - ./data:/app/data